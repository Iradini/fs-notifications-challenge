{% extends "layout.html" %}
{% block content %}
<!-- Filled by the script below from "/api/notifications/{id}" 
 The API only returns it to its owner; nothing private is rendered here -->
  <article id="notificationView" data-auth="in" class="content-section py-3 px-4 mb-4">
    <div class="d-flex align-items-start gap-4">
      <img class="rounded-circle article-img flex-shrink-0"
           src="{{ url_for('static', path='profile_pics/default.jpg') }}"
           alt=""
           width="64"
           height="64"
           loading="lazy">
      <div class="flex-grow-1">
        <div class="article-metadata mb-2">
          <span class="me-2" id="metaChannel"></span>
          <small class="text-body-secondary" id="metaDate"></small>
        </div>
        <h2 class="article-title" id="viewTitle"></h2>
        <p class="article-content" id="viewContent"></p>
        <div class="article-content mb-2">
          <a class="me-2 text-break" id="viewRecipient"></a>
          <small class="text-body-secondary" id="viewStatus"></small>
        </div>
        <div class="notification-actions mt-3 pt-3 border-top">
          <button type="button" class="btn btn-outline-secondary me-1" data-bs-toggle="modal" data-bs-target="#editModal">Edit
            Notification</button>
          <button type="button" class="btn btn-outline-danger" data-bs-toggle="modal" data-bs-target="#deleteModal">Delete
            Notification</button>
        </div>
      </div>
    </div>
  </article>
  <p id="notFoundMessage" class="text-body-secondary d-none">
    This notification doesn't exists. <a href="{{ url_for('home') }}">Back to your notifications</a>
  </p>
  <!-- Edit Notification Modal -->
  <div class="modal fade" id="editModal" tabindex="-1" aria-labelledby="editModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="editModalLabel">Edit Notification</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <form id="editNotificationForm">
          <div class="modal-body">
            <div class="mb-3">
              <label for="editTitle" class="form-label">Title</label>
              <input type="text" class="form-control" id="editTitle" name="title" required>
            </div>
            <div class="mb-3">
              <label for="editContent" class="form-label">Content</label>
              <textarea class="form-control" id="editContent" name="content" rows="5" required></textarea>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary">Save Changes</button>
          </div>
        </form>
      </div>
    </div>
  </div>
  <!-- Delete Confirmation Modal -->
  <div class="modal fade"
       id="deleteModal"
       tabindex="-1"
       aria-labelledby="deleteModalLabel"
       aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="deleteModalLabel">Delete Notification?</h5>
          <button type="button"
                  class="btn-close btn-close-white"
                  data-bs-dismiss="modal"
                  aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <p class="fs-5">Are you sure you want to delete this notification? This action cannot be undone.</p>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-danger" id="confirmDelete">Delete</button>
        </div>
      </div>
    </div>
  </div>
{% endblock content %}
{% block scripts %}
<script type="module">
  import { authFetch, getCurrentUser } from "/static/js/auth.js";
  import { formatDate, getErrorMessage, hideModal, showModal } from "/static/js/utils.js";

  // Get notification ID from Jinja2 template
  const notificationId = {{ notification_id }};
  const user = await getCurrentUser();

  function showError(message) {
    document.getElementById("errorMessage").textContent = message;
    showModal("errorModal");
  }

  async function loadNotification() {
    const response = await authFetch(`/api/notifications/${notificationId}`);
    if (response.status == 404) {
      document.getElementById("notFoundMessage").classList.remove("d-none");
      return;
    }
    if (!response.ok) {
      showError(getErrorMessage(await response.json()));
      return;
    }
    const n = await response.json();
    // textContent / .value, never innerHTML: titles and content are user input
    document.getElementById("metaChannel").textContent = n.channel;
    document.getElementById("metaDate").textContent = formatDate(n.created_at);
    document.getElementById("viewTitle").textContent = n.title;
    document.getElementById("viewContent").textContent = n.content;
    document.getElementById("viewRecipient").textContent = n.recipient.email ?? n.recipient.phone ?? n.recipient.token;
    document.getElementById("viewStatus").textContent = n.status;
    document.getElementById("editTitle").value = n.title;
    document.getElementById("editContent").value = n.content;
    document.getElementById("notificationView").classList.remove("d-none");
  }

  // Edit Notification Form Handler
  const editForm = document.getElementById("editNotificationForm");
  editForm.addEventListener("submit", async (event) => {
    // Stop default form submission - we'll handle it with JavaScript
    event.preventDefault();
    const notificationData = Object.fromEntries(new FormData(editForm).entries());

    try {
      // PATCH for partial update (just title and content, not user_id)
      const response = await authFetch(`/api/notifications/${notificationId}`, {
        method: "PATCH",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(notificationData),
      });

      if (response.ok) {
        document.getElementById("successMessage").textContent = "Notification updated successfully!";
        hideModal("editModal");
        showModal("successModal");
        document.getElementById("successModal").addEventListener(
            "hidden.bs.modal",
            () => window.location.reload(),
            { once: true },
          );
      } else {
        hideModal("editModal");
        showError(getErrorMessage(await response.json()));
      }
    } catch (error) {
      showError("Network error. Please check your connection and try again.");
    }
  });

  // Delete Notification Handler 
  document.getElementById("confirmDelete").addEventListener("click", async () => {
    try {
      // DELETE request - no body needed, notification_id is in the URL
      const response = await authFetch(`/api/notifications/${notificationId}`, { method: "DELETE" });

      // 204 = No Content (success)
      if (response.status === 204) {
        // Notification is gone, redirect to home page
        window.location.href = "/";
      } else {
        hideModal("deleteModal");
        showError(getErrorMessage(await response.json()));
      }
    } catch (error) {
      showError("Network error. Please check your connetion and try again.");
    }
  });

  // Not logged in: nothing to show here, go to the login page
  if (user) loadNotification();
  else window.location.href = "/login";
</script>
{% endblock scripts %}

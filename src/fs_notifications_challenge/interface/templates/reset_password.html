{% extends "layout.html" %}
{% block content %}
    <div class="content-section py-3 px-4 mb-4">
        <h2 class="mb-4">Reset Password</h2>
        <p class="text-body-secondary mb-4">Enter your new password below.</p>
        <form id="resetPasswordForm">
            <div class="mb-3">
                <label for="newPassword" class="form-label">New Password</label>
                <input type="password" class="form-control" id="newPassword" autocomplete="new-password"
                       required minlength="8" autofocus>
                <div class="form-text">Password must be at least 8 characters.</div>
            </div>
            <div class="mb-3">
                <label for="confirmPassword" class="form-label">Confirm New Password</label>
                <input type="password" class="form-control" id="confirmPassword" autocomplete="new-password"
                       required minlength="8">
            </div>
            <button type="submit" class="btn btn-primary" id="submitBtn">Reset Password</button>
        </form>
        <p class="mt-3">Remember your password? <a href="{{ url_for("login_page") }}">Login here</a></p>
    </div>
{% endblock content %}
{% block scripts %}
    <script type="module">
      import { getErrorMessage, showModal } from '/static/js/utils.js';

      const token = new URLSearchParams(window.location.search).get('token');
      const form = document.getElementById('resetPasswordForm');
      const submitBtn = document.getElementById('submitBtn');
      const newPassword = document.getElementById('newPassword');
      const confirmPassword = document.getElementById('confirmPassword');

      function showError(message) {
        document.getElementById('errorMessage').textContent = message;
        showModal('errorModal');
      }

      // No token in the address: nothing here can work, so say so instead of failing later
      if (!token) {
        showError('Invalid or missing reset link. Please request a new password reset.');
        submitBtn.disabled = true;
      }

      function checkPasswordsMatch() {
        confirmPassword.setCustomValidity(
          newPassword.value === confirmPassword.value ? '' : 'Passwords do not match.',
        );
      }
      newPassword.addEventListener('input', checkPasswordsMatch);
      confirmPassword.addEventListener('input', checkPasswordsMatch);

      form.addEventListener('submit', async (event) => {
        event.preventDefault();     // only runs when the browser's own validation passed
        submitBtn.disabled = true;
        submitBtn.textContent = 'Resetting...';

        try {
          const response = await fetch('/api/auth/reset-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token, new_password: newPassword.value }),
          });

          if (response.ok) {
            document.getElementById('successMessage').textContent =
              'Password reset successfully! You can now log in with your new password.';
            showModal('successModal');
            document.getElementById('successModal').addEventListener('hidden.bs.modal', () => {
              window.location.href = '/login';
            }, { once: true });
          } else {
            showError(getErrorMessage(await response.json()));
          }
        } catch {
          showError('Network error. Please check your connection and try again.');
        } finally {
          submitBtn.disabled = !token;
          submitBtn.textContent = 'Reset Password';
        }
      });
    </script>
{% endblock scripts %}

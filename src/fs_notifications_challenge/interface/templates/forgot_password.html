{% extends "layout.html" %}
{% block content %}
    <div class="content-section py-3 px-4 mb-4">
        <h2 class="mb-4">Forgot Password</h2>
        <p class="text-body-secondary mb-4">Enter your email address and we'll send you a link to reset your password.</p>
        <form id="forgotPasswordForm">
            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" name="email" autocomplete="email" required autofocus>
            </div>
            <button type="submit" class="btn btn-primary" id="submitBtn">Send Reset Link</button>
        </form>
        <p class="mt-3">Remember your password? <a href="{{ url_for("login_page") }}">Login here</a></p>
    </div>
{% endblock content %}
{% block scripts %}
    <script type="module">
      import { getErrorMessage, showModal } from '/static/js/utils.js';

      const form = document.getElementById('forgotPasswordForm');
      const submitBtn = document.getElementById('submitBtn');

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        submitBtn.disabled = true;
        submitBtn.textContent = 'Sending...';

        try {
          const response = await fetch('/api/auth/forgot-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: document.getElementById('email').value.trim() }),
          });

          if (response.status === 202) {
            // Same words whether or not the email has an account: the page must not reveal it
            document.getElementById('successMessage').textContent =
              'If an account exists with this email, you will receive password reset instructions shortly.';
            showModal('successModal');
            form.reset();
          } else {
            document.getElementById('errorMessage').textContent = getErrorMessage(await response.json());
            showModal('errorModal');
          }
        } catch {
          document.getElementById('errorMessage').textContent =
            'Network error. Please check your connection and try again.';
          showModal('errorModal');
        } finally {
          submitBtn.disabled = false;
          submitBtn.textContent = 'Send Reset Link';
        }
      });
    </script>
{% endblock scripts %}
